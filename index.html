<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Dog Training Journey</title>
<meta name="theme-color" content="#0F3D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dog Training">
<meta name="mobile-web-app-capable" content="yes">
<link id="apple-icon" rel="apple-touch-icon" href="">
<link id="favicon" rel="icon" href="">
<link id="manifest-link" rel="manifest" href="">
<style>
:root{
  --teal-900:#0F3D3A;
  --teal-700:#1F6F68;
  --teal-600:#26857C;
  --teal-500:#2F8F86;
  --teal-100:#DCEAE7;
  --canvas:#F6F3EC;
  --paper:#FFFEFB;
  --sand:#EDE7D9;
  --sand-dark:#E1D9C4;
  --ink:#24261F;
  --ink-soft:#5B5D52;
  --ink-faint:#8B8C7F;
  --line:#DAD4C4;
  --clay:#A85C3B;
  --clay-soft:#EFE0D6;
  --moss:#5F7C4E;
  --moss-soft:#E1E9D8;
  --danger:#A83B3B;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --shadow-card:0 1px 2px rgba(36,38,31,0.06), 0 6px 18px rgba(36,38,31,0.06);
  --font-display:'Fraunces', Georgia, 'Iowan Old Style', serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--teal-900);}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--canvas);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--teal-100);}
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  background:var(--canvas);
  position:relative;
  padding-bottom:calc(24px + var(--safe-bottom));
  box-shadow:0 0 60px rgba(0,0,0,0.15);
}
a{color:var(--teal-700);}

/* ---------- Utility ---------- */
.hidden{display:none !important;}
.container{padding:0 20px;}
.stack{display:flex; flex-direction:column;}
.row{display:flex; align-items:center;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 20px; border-radius:999px; border:none;
  font-size:15px; font-weight:600; line-height:1;
  transition:transform .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--teal-700); color:#fff;}
.btn-primary:disabled{background:var(--ink-faint); opacity:.5; cursor:not-allowed;}
.btn-ghost{background:transparent; color:var(--teal-700); border:1.5px solid var(--teal-700);}
.btn-plain{background:var(--sand); color:var(--ink);}
.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px; font-size:13px; border-radius:999px;}
.pill{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 12px; border-radius:999px; font-size:12px; font-weight:600;
  letter-spacing:.02em; text-transform:uppercase;
}
.pill-active{background:var(--teal-100); color:var(--teal-900);}
.pill-complete{background:var(--moss-soft); color:var(--moss);}
.pill-locked{background:var(--sand-dark); color:var(--ink-faint);}
.divider{height:1px; background:var(--line); border:none; margin:0;}
.divider-strong{height:1px; background:var(--ink-faint); opacity:.35; border:none; margin:0;}
.divider-hero{height:2px; background:var(--teal-700); border:none; margin:0; width:40px; border-radius:2px;}
.card{
  background:var(--paper);
  border-radius:var(--radius-m);
  border:1px solid var(--line);
}
.muted{color:var(--ink-soft);}
.faint{color:var(--ink-faint); font-size:13px;}
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:none;
  background:var(--sand); display:flex; align-items:center; justify-content:center;
  color:var(--ink);
}
.icon-btn svg{width:18px;height:18px;}
.top-nav{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(14px + var(--safe-top)) 16px 12px;
  background:linear-gradient(var(--canvas) 65%, transparent);
}
.top-nav .title{font-family:var(--font-display); font-size:19px; font-weight:600;}

/* ---------- Splash / Onboarding ---------- */
.onboard-screen{
  min-height:100vh; display:flex; flex-direction:column;
  padding:calc(28px + var(--safe-top)) 24px calc(28px + var(--safe-bottom));
}
.onboard-brand{display:flex; align-items:center; gap:10px;}
.onboard-brand .mark{width:34px;height:34px;}
.onboard-brand .name{font-family:var(--font-display); font-size:18px; font-weight:600; color:var(--teal-900);}
.onboard-hero{flex:1; display:flex; flex-direction:column; justify-content:center; padding:24px 0;}
.onboard-hero h1{font-size:34px; line-height:1.12; color:var(--teal-900); margin:0 0 14px;}
.onboard-hero p{font-size:16px; color:var(--ink-soft); line-height:1.5; margin:0 0 6px; max-width:38ch;}
.onboard-actions{margin-top:0;}
.step-eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--teal-600); font-weight:700; margin-bottom:10px;}
.step-q{font-size:24px; line-height:1.3; margin:0 0 8px; color:var(--teal-900);}
.step-sub{font-size:14.5px; color:var(--ink-soft); margin:0 0 26px; line-height:1.5;}
.choice-list{display:flex; flex-direction:column; gap:10px;}
.choice{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px; border-radius:var(--radius-m);
  background:var(--paper); border:1.5px solid var(--line);
  font-size:15.5px; font-weight:600; text-align:left; width:100%;
}
.choice.selected{border-color:var(--teal-700); background:var(--teal-100); color:var(--teal-900);}
.choice .sub{font-weight:400; color:var(--ink-soft); font-size:13px; margin-top:2px;}
.field{margin-bottom:20px;}
.field label{display:block; font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:8px;}
.field input[type=text], .field select{
  width:100%; padding:14px 16px; border-radius:var(--radius-s);
  border:1.5px solid var(--line); background:var(--paper); font-size:16px; color:var(--ink);
}
.field input[type=text]:focus, .field select:focus, .choice:focus-visible, button:focus-visible, a:focus-visible{
  outline:2.5px solid var(--teal-500); outline-offset:2px;
}
.gender-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
.gender-grid .choice{padding:12px 8px; justify-content:center; text-align:center; font-size:13.5px;}
.onboard-footer{margin-top:28px; display:flex; gap:10px;}
.progress-dots{display:flex; gap:6px; margin-bottom:20px;}
.progress-dots span{width:6px;height:6px;border-radius:50%;background:var(--sand-dark);}
.progress-dots span.on{background:var(--teal-600); width:18px; border-radius:3px;}
.loc-setup-item{padding:16px 0;}
.loc-setup-item .idx{font-family:var(--font-mono); font-size:11px; color:var(--teal-600); font-weight:700;}
.loc-setup-item .desc{font-size:13px; color:var(--ink-soft); margin:4px 0 10px; line-height:1.45;}
.loc-setup-item input{
  width:100%; padding:11px 14px; border-radius:var(--radius-s);
  border:1.5px solid var(--line); background:var(--paper); font-size:15px;
}

/* ---------- Journey (trail map) ---------- */
.journey-wrap{padding:4px 0 40px;}
.journey-hero{padding:6px 20px 22px;}
.journey-hero .eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--teal-600); font-weight:700;}
.journey-hero h1{font-size:26px; margin:8px 0 4px; color:var(--teal-900);}
.journey-hero p{color:var(--ink-soft); font-size:14.5px; margin:0; line-height:1.5;}
.trail{position:relative; padding:10px 0 10px 0;}
.trail-svg-col{position:absolute; left:34px; top:0; bottom:0; width:4px;}
.node-row{
  position:relative; display:flex; gap:16px; padding:0 20px 34px 20px; align-items:flex-start;
}
.node-row:last-child{padding-bottom:6px;}
.node-dot-wrap{position:relative; width:32px; display:flex; justify-content:center; flex-shrink:0; z-index:2;}
.node-dot{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--line); background:var(--paper); color:var(--ink-faint);
  font-family:var(--font-mono); font-size:12px; font-weight:700;
}
.node-dot svg{width:15px;height:15px;}
.node-row.active .node-dot{background:var(--teal-700); border-color:var(--teal-700); color:#fff; box-shadow:0 0 0 5px var(--teal-100);}
.node-row.complete .node-dot{background:var(--moss); border-color:var(--moss); color:#fff;}
.node-card{
  flex:1; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-m);
  width:100%; overflow:hidden;
}
.node-card-open{display:block; width:100%; text-align:left; padding:16px 16px 12px; background:transparent; border:none;}
.node-row.locked .node-card{background:transparent; border-style:dashed; opacity:.7;}
.node-row.active .node-card{border-color:var(--teal-600); box-shadow:var(--shadow-card);}
.node-card .label{font-family:var(--font-display); font-size:17px; font-weight:600; color:var(--teal-900); margin-bottom:2px;}
.node-row.locked .node-card .label{color:var(--ink-faint);}
.node-card .goal{font-size:13.5px; color:var(--ink-soft); line-height:1.45; margin-top:4px;}
.node-card .meta-row{display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap;}
.pill-ext{background:var(--clay-soft); color:var(--clay);}
.node-card-footer{display:flex; align-items:center; gap:8px; padding:0 16px 14px; flex-wrap:wrap; border-top:1px dashed var(--line); margin-top:2px; padding-top:10px;}
.btn-extend{
  font-family:inherit; font-size:12.5px; font-weight:700; color:var(--teal-700);
  background:var(--teal-100); border:none; border-radius:999px; padding:7px 13px;
}
.btn-extend:disabled{opacity:.4;}
.btn-extend-remove{background:var(--sand-dark); color:var(--ink-soft);}
.trail-connector{
  position:absolute; left:15px; top:32px; bottom:-34px; width:2px;
  background:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 11px);
}
.node-row.complete .trail-connector{background:var(--moss); opacity:.4;}
.node-row:last-child .trail-connector{display:none;}

.fab-settings{
  position:fixed; right:calc(16px + (100vw - 520px)/2); bottom:calc(20px + var(--safe-bottom));
  z-index:30; width:52px;height:52px;border-radius:50%;
  background:var(--teal-900); color:#fff; border:none; box-shadow:0 8px 24px rgba(15,61,58,.35);
  display:flex; align-items:center; justify-content:center;
}
@media (max-width:552px){ .fab-settings{ right:16px; } }
.fab-settings svg{width:22px;height:22px;}

/* ---------- Week Card / Detail screen ---------- */
.detail-topbar{
  position:sticky; top:0; z-index:16; background:var(--teal-900); color:#fff;
  display:flex; align-items:center; gap:8px;
  padding:calc(14px + var(--safe-top)) 18px 14px;
}
.detail-topbar .back-btn, .detail-topbar .icon-btn-dark{
  width:36px;height:36px;border-radius:50%; background:rgba(255,255,255,.14); border:none;
  display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
}
.detail-topbar .back-btn svg, .detail-topbar .icon-btn-dark svg{width:17px;height:17px;}
.detail-topbar-title{
  flex:1; min-width:0; font-family:var(--font-display); font-size:16.5px; font-weight:600; color:#fff;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  opacity:0; transform:translateY(5px);
  transition:opacity .18s ease, transform .18s ease;
}
.detail-topbar.collapsed .detail-topbar-title{opacity:1; transform:translateY(0);}
.icon-btn-dark.flash-red{background:var(--danger) !important; color:#fff; transition:background .25s ease;}
.detail-hero{
  background:var(--teal-900); color:#fff; padding:0 18px 18px;
  border-radius:0 0 20px 20px; margin-top:-2px;
  transition:opacity .18s ease;
}
.detail-topbar.collapsed + .detail-hero{opacity:.94;}
.detail-hero .phase-eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--teal-100); font-weight:700;}
.detail-hero h1{font-size:24px; margin:6px 0 8px; color:#fff;}
.detail-hero .overview{font-size:14px; color:var(--teal-100); line-height:1.55; opacity:.92; margin:0;}
.action-row{display:flex; gap:10px; margin-top:16px;}
.action-chip{
  flex:1; display:flex; flex-direction:column; align-items:flex-start; gap:6px;
  background:rgba(255,255,255,.12); border:none; border-radius:var(--radius-s);
  padding:11px 12px; color:#fff; text-align:left;
}
.action-chip svg{width:16px;height:16px;}
.action-chip .lbl{font-size:12.5px; font-weight:700;}

.section-label{
  font-size:12px; text-transform:uppercase; letter-spacing:.07em; font-weight:700;
  color:var(--teal-700); padding:22px 20px 10px;
}
.carousel{display:flex; gap:12px; overflow-x:auto; padding:2px 20px 6px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;}
.carousel::-webkit-scrollbar{display:none;}
.ex-card{
  scroll-snap-align:start; flex:0 0 86%; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius-m); padding:18px; box-shadow:var(--shadow-card);
}
.ex-card h3{margin:0 0 12px; font-size:18px; color:var(--teal-900);}
.ex-card .subhead{font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--teal-600); margin:14px 0 6px;}
.ex-card .subhead:first-of-type{margin-top:0;}
.ex-card ul{margin:0; padding-left:18px;}
.ex-card li{font-size:14px; line-height:1.55; margin-bottom:6px; color:var(--ink);}
.ex-card .why-text{font-size:14px; line-height:1.6; color:var(--ink-soft); margin:0;}
.tip-box{margin-top:14px; padding:12px 14px; background:var(--teal-100); border-radius:var(--radius-s);}
.tip-box .tip-head{display:flex; align-items:center; gap:6px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--teal-900); margin-bottom:6px;}
.tip-box .tip-head svg{width:14px;height:14px;}
.tip-box p{font-size:13.5px; line-height:1.55; color:var(--teal-900); margin:0 0 6px;}
.tip-box p:last-child{margin-bottom:0;}
.carousel-dots{display:flex; justify-content:center; gap:5px; margin:10px 0 0;}
.carousel-dots span{width:5px;height:5px;border-radius:50%; background:var(--sand-dark);}
.carousel-dots span.on{background:var(--teal-600);}

.days-list{padding:6px 20px 10px;}
.day-row{border-bottom:1px solid var(--line);}
.day-row:last-child{border-bottom:none;}
.day-row-head{
  width:100%; background:none; border:none; display:flex; align-items:center; justify-content:space-between;
  padding:16px 2px; text-align:left; gap:10px;
}
.day-row-head .left{display:flex; align-items:center; gap:12px;}
.day-badge{
  width:34px;height:34px;border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:12.5px; flex-shrink:0;
  background:var(--sand); color:var(--ink-soft);
}
.day-badge svg{width:16px;height:16px;}
.day-row.complete .day-badge{background:var(--moss-soft); color:var(--moss);}
.day-row.active .day-badge{background:var(--teal-700); color:#fff;}
.day-row.locked .day-badge{color:var(--ink-faint);}
.day-title{font-weight:600; font-size:15px;}
.day-row.locked .day-title{color:var(--ink-faint);}
.day-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.chev{transition:transform .18s ease; color:var(--ink-faint); flex-shrink:0;}
.chev svg{width:16px;height:16px;}
.day-row.open .chev{transform:rotate(180deg);}
.day-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.day-row.open .day-body{max-height:2000px;}
.day-body-inner{padding:0 2px 18px;}
.session-block{margin-bottom:16px;}
.session-block:last-child{margin-bottom:0;}
.session-name{font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--teal-700); margin-bottom:8px;}
.component-chain{display:flex; flex-direction:column; gap:0;}
.component{display:flex; align-items:flex-start; gap:10px; padding:8px 0;}
.component:not(:last-child){border-bottom:1px dashed var(--line);}
.component .dot{width:7px;height:7px;border-radius:50%; background:var(--teal-500); margin-top:6px; flex-shrink:0;}
.component .ctext{font-size:14px; line-height:1.4;}
.component .ctext b{font-weight:600;}
.component .cloc{font-size:12px; color:var(--ink-faint); margin-top:1px;}
.tag{display:inline-block; padding:1px 7px; border-radius:999px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-right:6px; vertical-align:middle; position:relative; top:-1px;}
.tag-pre{background:var(--sand-dark); color:var(--ink-faint);}
.tag-post{background:var(--teal-100); color:var(--teal-700);}
.component.pre-post .ctext{font-size:13px;}
.day-locked-note{
  display:flex; align-items:center; gap:8px; padding:12px 14px; margin-top:6px;
  background:var(--sand); border-radius:var(--radius-s); font-size:13px; color:var(--ink-soft);
}
.day-locked-note svg{width:15px;height:15px; flex-shrink:0;}
.complete-btn-wrap{margin-top:14px;}

/* ---------- Modals ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(15,17,14,.5); z-index:50;
  display:flex; align-items:flex-end; justify-content:center;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.modal-sheet{
  width:100%; max-width:520px; background:var(--canvas); border-radius:22px 22px 0 0;
  max-height:88vh; overflow-y:auto; padding-bottom:calc(28px + var(--safe-bottom));
  animation:slideUp .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes slideUp{from{transform:translateY(24px); opacity:.6} to{transform:translateY(0); opacity:1}}
.modal-grabber{width:38px;height:4px;background:var(--sand-dark); border-radius:3px; margin:12px auto 4px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:8px 20px 14px;}
.modal-head h2{font-size:19px; margin:0; color:var(--teal-900);}
.modal-close{width:32px;height:32px;border-radius:50%; background:var(--sand); border:none; display:flex; align-items:center; justify-content:center;}
.modal-close svg{width:14px;height:14px;}
.tabs{display:flex; gap:8px; padding:0 20px 14px;}
.tab-btn{padding:9px 16px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); font-size:13.5px; font-weight:600; color:var(--ink-soft);}
.tab-btn.on{background:var(--teal-700); border-color:var(--teal-700); color:#fff;}
.modal-body{padding:0 20px 10px;}
.loc-item{padding:14px 0; border-bottom:1px solid var(--line);}
.loc-item:last-child{border-bottom:none;}
.loc-item .num{font-family:var(--font-mono); font-size:11px; color:var(--teal-600); font-weight:700;}
.loc-item .chosen{font-size:15.5px; font-weight:600; margin:3px 0 2px;}
.loc-item .desc{font-size:13px; color:var(--ink-soft); line-height:1.5;}
.rule-item{padding:14px 0; border-bottom:1px solid var(--line);}
.rule-item:last-child{border-bottom:none;}
.rule-item .rtitle{font-weight:600; font-size:14.5px; margin-bottom:4px; color:var(--teal-900);}
.rule-item p{margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.55;}
.glossary-item{padding:13px 0; border-bottom:1px solid var(--line);}
.glossary-item:last-child{border-bottom:none;}
.glossary-item dt{font-weight:700; font-size:14.5px; color:var(--teal-900); font-family:var(--font-display);}
.glossary-item dd{margin:4px 0 0; font-size:13.5px; color:var(--ink-soft); line-height:1.55;}
.golden-banner{
  background:var(--teal-900); color:#fff; border-radius:var(--radius-m); padding:16px 18px; margin:0 0 16px;
}
.golden-banner .gt{font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; color:var(--teal-100); margin-bottom:8px;}
.golden-banner li{font-size:13.5px; line-height:1.5; margin-bottom:6px; color:#fff;}
.golden-banner li:last-child{margin-bottom:0;}

/* ---------- Settings ---------- */
.settings-section{padding:18px 20px;}
.settings-section h3{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--teal-700); margin:0 0 12px;}
.setting-row{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:14px 0; border-bottom:1px solid var(--line);
}
.setting-row:last-child{border-bottom:none;}
.setting-row .lbl{font-size:14.5px; font-weight:600;}
.setting-row .desc{font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.4;}
.switch{width:46px;height:27px;border-radius:999px; background:var(--sand-dark); position:relative; border:none; flex-shrink:0;}
.switch.on{background:var(--teal-600);}
.switch::after{content:'';position:absolute; top:3px; left:3px; width:21px;height:21px;border-radius:50%; background:#fff; transition:transform .16s ease; box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch.on::after{transform:translateX(19px);}

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(28px + var(--safe-bottom)); transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-size:13.5px;
  z-index:80; box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

.empty-note{padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:14px;}
</style>
</head>

/* ---------------- Personalization ---------------- */
function personalize(str, s){
  if(!str) return str;
  const name = (s && s.dogName) ? s.dogName : 'your dog';
  const obj = s && s.dogGender==='female' ? 'her' : 'him';
  const poss = s && s.dogGender==='female' ? 'her' : 'his';
  return str.replace(/\{\{(dog_name|dog_object|dog_possessive)\}\}/g, (m,g)=>{
    if(g==='dog_name') return name;
    if(g==='dog_object') return obj;
    return poss;
  });
}
function P(str){ return personalize(str, STATE); }

/* ============================================================
   SESSION LOCATION LIBRARY
   Single source of truth for where each session takes place.
   Keyed by phaseId, then by day number, then by session
   ('morning' / 'afternoon' / 'evening', or 'morning' / 'evening'

   DEFAULT locations for the program as written.

   Values are numeric LOCATIONS ids (see the LOCATIONS array above —
   the same 20 locations the person names during onboarding / in the
   Locations settings screen), NOT location names. Using the id
   means a session automatically follows whatever the person has
   renamed that location to — e.g. id 4 always means "whatever the
   person called LOCATION 4", even if they typed "Sarah's Field"
   instead of the default "Garden Centre (Car Park)". A couple of
   entries use a literal string instead of an id — 'Home' (Place/
   evening-at-home, never reassigned) and a few pre-requisite-phase
   locations like 'Kitchen' that aren't part of the 20-location
   catalog and are never renamed by the person.

   TO SWAP WHICH LOCATION A SESSION USES:
   Edit the relevant day/session entry below with the id of the
   location you want instead — e.g. to move Week 1 Day 3's afternoon
   session to LOCATION 3 ('Top of Road') instead of LOCATION 2
   ('Front Drive'), set SESSION_LOCATION_LIBRARY.week1[3].afternoon = 3.
   Nothing else needs to change; genWeekXDays() functions below read
   from this library via sessionLocation(phaseId, day, key), and
   resolveSessionLocationValue() turns the id into whatever the

   ============================================================ */

/* Resolve which location a given (phase, day, session) takes place at.
   Returns the RAW value stored in the library — either a numeric
   LOCATIONS id (a real, user-nameable catalog location) or a literal
   string for the handful of fixed, non-catalog locations (e.g.
   'Kitchen', or the 'Home' sentinel used for Place/evening-at-home).
   Falls back sensibly if a specific session key isn't defined for that
   day (e.g. pre-phase feeds only define morning/evening, not afternoon). */
function sessionLocation(phaseId, day, sessionKey){
  const dayMap = SESSION_LOCATION_LIBRARY[phaseId] && SESSION_LOCATION_LIBRARY[phaseId][day];
  if(!dayMap) return null;
  return dayMap[sessionKey] != null ? dayMap[sessionKey] : dayMap.morning;
}
/* Turn a sessionLocation() value into display text, applying the
   person's own naming from STATE.locationAssignments when the value
   is a real catalog location id. Non-catalog literal strings (e.g.
   'Kitchen', 'Home') pass through unchanged — there's nothing to map
   them to, since the person is never asked to name those. */
function resolveSessionLocationValue(value){
  if(typeof value === 'number'){
    const loc = LOC_BY_ID[value];
    if(!loc) return String(value);
    return STATE.locationAssignments[loc.id] || loc.name;
  }
  return value;
}

const GLOSSARY = [

/* ============================================================
   CHECK-IN LIBRARY
   Single source of truth for what's needed at each week-end
   check-in. Keyed by phaseId, then by week-within-that-phase
   (1-based) — e.g. CHECKIN_LIBRARY['weeks4-5'][2] is the content
   for the 2nd week-end inside the Weeks 4 & 5 block.

   TO MOVE CHECK-IN CONTENT TO A DIFFERENT WEEK-END:
   Change which week-within-phase number a given items[] block sits
   under. If a phase is extended with extra weeks, the last defined
   week-within-phase number's content is reused automatically (see
   checkinKey() below) — same pattern as extension weeks reusing the
   last week's locations.
   ============================================================ */
const CHECKIN_LIBRARY = {

/* Resolve a phase + week-within-phase to its check-in content. Falls
   back to the highest defined week-within-phase for that phase (so
   extension weeks keep getting a check-in, reusing the last one). */
function checkinKey(phaseId, weekWithinPhase){
  const fam = CHECKIN_LIBRARY[phaseId];
  if(!fam) return null;
  const weekNums = Object.keys(fam).map(Number);
  const maxWeek = Math.max(...weekNums);
  return fam[Math.min(weekWithinPhase, maxWeek)];
}

/* ============================================================
   EXERCISE LIBRARY
   Single source of truth for every exercise's How / Why / Pro-tip
   content. Exercises are grouped into "families" (Play, Place,
   Recall, Redirect, etc.) and each family holds its content
   progression as numbered phases (1, 2, 3...).

   This is the ONLY place exercise wording lives. Weeks/phases never
   embed exercise text directly — they reference a (family, phase)
   pair via libKey(family, phase), e.g. libKey('play', 2). See the
   PHASES registry and the genWeekXDays() functions below for where
   those references live.

   TO MOVE AN EXERCISE PHASE TO A DIFFERENT WEEK:
   Do NOT touch this library. Instead, find every libKey('family', N)
   call that currently points at the phase you want to move (in
   PHASES[...].exerciseKeys / .dailyTaskKey, and inside the matching
   genWeekXDays() function's T(...) calls — Play and Place included,
   they're ordinary T(...) calls too, no special-casing), and change
   which week/session calls it. The content itself never needs to
   change or move.
   ============================================================ */
const EXERCISE_LIBRARY = {
  crate: { label:"Crate", phases:{
    1: { key:"crate", title:"Crate", how:[
        "Straight after Play, guide {{dog_name}} into the crate and settle {{dog_object}} down with a chew or stuffed toy.",
        "Keep it calm and low-stimulation — this is a wind-down, not another game. No more interaction once {{dog_name}} is settled.",
      ], why:"Crating immediately after Play channels the arousal Play builds up into a calm, contained space, helping {{dog_name}} learn to come down from excitement quickly rather than carrying it into whatever comes next." },
  }},
  handFeeding: { label:"Hand Feeding", phases:{
    1: { key:"handFeeding", title:"Hand Feeding", how:[
        "No bowl feeding at all; no wet food — kibble only.",
        "Twice daily (morning meal, evening meal), fill a treat pouch with {{dog_possessive}} full meal and hand-feed it entirely.",
        "Location progresses across the week: Kitchen → Garden → Street just outside the front of the house.",
        "Immediately after each feed, {{dog_name}} goes straight back inside."
      ], why:"This is really just a mental switch — for {{dog_name}} and for you — that without you, {{dog_possessive}} food does not exist. It gets {{dog_name}} used to not being able to access food for free, which is the foundation everything else in the program builds on." },
  }},
  newtonsCradle: { label:"Newton's Cradle", phases:{
    1: { key:"newtonsCradle", title:"Newton's Cradle", how:[
        "Pick a marker word/sound (e.g. \"Yes\", or a clicker).",
        "A single set is left → right → jackpot: throw a piece of kibble to your left, marking as you throw. When {{dog_name}} turns back from eating it, mark again and throw to the right. On the third turn, mark, then move backwards continuously away from {{dog_name}} while delivering 10–15 pieces of kibble one at a time — the jackpot event that completes the set. Repeat sets until the full meal is consumed.",
        "Critical timing: mark before any visible hand-to-pocket movement, and immediately when {{dog_possessive}} head turns back toward you — never before.",
        "Set rotation per feeding session (2 feeds/day × 7 days = 14 sessions, numbered continuously): 5 → 10 → 15 → 5 → 10 → 15…",
        "On the final set of each session, the jackpot event uses whatever food remains for that meal.",
        "{{dog_name}} must be on a flexi lead throughout."
      ], why:"Dogs have a hierarchy of communication — physical, sight, then audio, which is their least preferred. If {{dog_name}} sees your hand move to your pocket before the marker, {{dog_name}} learns hand-to-pocket (not the marker) predicts food. Marking first, every time, keeps the marker as the one true predictor of food arriving.\n\nMoving backwards during the jackpot event taps into {{dog_possessive}} prey drive — {{dog_name}} has to keep working for it. Jackpots create a “gambler’s” effect: “if I go back this time I might win big!” — this keeps {{dog_name}} guessing about value and coming back for more. The jackpot is never thrown on the floor, because chasing you should always be the best part of the game.\n\nThe preceding Hand Feeding week gets {{dog_name}} used to not being able to get food for free at all; Newton’s Cradle then builds the marker’s meaning on top of that foundation." },
  }},
  redirect: { label:"Redirect Exercise", phases:{
    1: { key:"redirectExercise", title:"Redirect Exercise", how:[
        "Use the prong collar on a 6ft lead and begin walking around.",
        "Every time {{dog_name}} appears to be distracted (sniffing the floor, a bush, or just not paying attention to you), use your marker and immediately start moving backwards, away from {{dog_name}}.",
        "If {{dog_name}} follows — great. Pay with 1 piece of kibble.",
        "If {{dog_name}} doesn’t follow and stays focused on the distraction, use lead pressure to guide {{dog_object}} to you, then pay.",
        "If your first attempt to guide {{dog_object}} back doesn’t work, use a little more pressure.",
        "Use taps, not pulls, on the lead. If you can’t tap (only pull), your lead is too tight — move closer to {{dog_name}}.",
        "Repeat every time {{dog_name}} gets distracted. Every 5th successful repetition, jackpot with 10–15 pieces of kibble, fed one at a time.",
        "Aim for the 85% success rule — short, focused sessions."
      ], why:"In low-distraction, low-reward situations, this starts teaching {{dog_name}} that you are a better choice than anything else around {{dog_object}}. It also teaches {{dog_name}} that your marker is non-negotiable — the lead pressure is what happens if {{dog_name}} chooses to ignore it — and starts teaching {{dog_name}} how to “turn off” pressure from the collar, in an environment where {{dog_name}} is unlikely to blow through it." },
    2: { key:"superFocusGame", title:"Super Focus Game", how:[
        "Stand somewhere with plenty of visible distractions, {{dog_name}} sat beside you. Every time {{dog_possessive}} focus shifts elsewhere — marker, move, pay.",
        "Expect these sessions to be short."
      ], why:"Super Focus further strengthens the value of your marker by “erasing” the world around {{dog_name}} — a development of the Redirect Exercise ahead of the real-trigger work that follows." },
    3: { key:"redirectTriggers", title:"Redirect Exercise", how:[
        "From Weeks 4 & 5 onward, this becomes about real triggers at a distance — other dogs, cats, birds, even “stooge” setups like people {{dog_name}} knows.",
        "Start from a fair distance. Make sure {{dog_name}} has clearly seen the trigger before you mark and redirect away from it.",
        "Over Weeks 4 & 5, gradually reduce the distance you’re working at as {{dog_name}} succeeds.",
        "From here on, keep closing the gap week by week (not day by day). Where possible, start walking alongside other dogs on the opposite side of the road, extending how long {{dog_name}} is exposed to the trigger.",
        "Layer in the Super Focus redirection work already covered as the gap closes."
      ], why:"This teaches {{dog_name}} that the marker, and returning to you for food, is worth more than a trigger at a distance. Closing the gap gradually — week by week rather than day by day — keeps {{dog_name}} succeeding rather than overwhelmed, the same 85% rule that’s guided every stage so far." },
  }},
  play: { label:"Play", phases:{
    1: { key:"play1", title:"Play", how:[
        "Put {{dog_name}} on {{dog_possessive}} prong collar and normal lead. Calmly take {{dog_object}} outside, let {{dog_object}} sniff and go to the toilet if needed.",
        "Hide the toy in your pocket or under your shirt. Hold the lead in one hand, present the toy with the other.",
        "Never put the toy in {{dog_possessive}} mouth. Show {{dog_object}} the toy, then immediately move it away — the game is that {{dog_name}} has to catch and “win” it.",
        "If {{dog_name}} latches on, keep hold of the toy and test {{dog_possessive}} grip. If it’s a good grip, don’t just let go — make a noise as if you tried hard to keep it, and let the toy “slip” out of your hands.",
        "Once {{dog_name}} has won the toy, keep moving away from {{dog_object}}. Let {{dog_name}} parade for a few seconds, then re-engage by grabbing part of the toy while still moving away.",
        "If {{dog_name}} drops the toy, race {{dog_object}} back to it — you must win.",
        "Aim to win the game roughly 2 times out of every 10, and always finish on a win for you — never {{dog_name}}.",
        "As soon as play ends, move straight into Place decompression — let this run at least 10–15 minutes. Early on this might stretch to 30 minutes if {{dog_possessive}} energy is still high; it will get quicker as training progresses."
      ], why:"Dogs need an outlet to express themselves. Without clear windows for this, pressure builds up until it eventually boils over. Play creates a clear window for {{dog_name}} to express {{dog_possessive}} nature.\n\nYou’ve probably noticed {{dog_name}} can go from 0 to 100 in a blink — but going from 100 back to 0 just as fast is arguably more impressive, which is why decompression happens immediately after play. Once tired out, {{dog_name}} is far more receptive to learning.\n\nWe always end the game on our win so {{dog_name}} feels a small sting of “losing” — next time, {{dog_name}} is less likely to drop the toy, remembering that doing so ended the game.",
      tip:[
        "Encourage {{dog_name}} — use your voice to let {{dog_object}} know {{dog_name}}’s doing great, and make this as fun as you can.",
        "If {{dog_name}} is uninterested in play and would rather interact with the environment, walk {{dog_object}} around and use the lead to pull {{dog_object}} away from anything {{dog_name}} chooses to interact with, always pulling {{dog_object}} towards you — keep moving at all times. Once {{dog_name}} starts watching you, begin play with the toy.",
        "If the game only lasts 30 seconds at this point, that’s fine. There’s a fine balance between ending too early and too late. Too early and {{dog_name}} won’t bother, since the fun ends as soon as it starts. Too late and {{dog_name}} has lost interest and won’t feel the sting of losing. The more {{dog_name}} wants to play, the longer sessions will naturally get."
      ] },
    2: { key:"playWithCues", title:"Play (with cues)", how:[
        "Introduce a start cue (\"Shall we play?\") and an end cue (\"All finished\").",
        "Decompression after play should be getting quicker by now than it was in Week 1 — keep an eye on how long it’s taking {{dog_name}} to settle."
      ], why:"Adding these cues creates a clear window for {{dog_name}} — unless those words are heard, {{dog_name}} shouldn’t be getting into high-arousal states." },
    3: { key:"playWithRules", title:"Play (with rules)", how:[
        "Start the game by building up frustration in {{dog_name}}: move backwards away from {{dog_name}} so {{dog_name}} starts chasing or jumping up at you. Gently push {{dog_object}} off and use phrases like “get off,” “come on” to build frustration ahead of the game. Once {{dog_possessive}} energy is high, reveal the toy and begin.",
        "Teach \"Out\": with the toy in {{dog_possessive}} mouth, drop to {{dog_possessive}} level, hand on the toy, firm \"OUT\" + two firm lead pops. Wait for release — don’t repeat the command, don’t pull the toy out yourself.",
        "Add a re-engage cue (a sound or word) that must be heard before {{dog_name}} is allowed back on the toy.",
        "As play develops, you can rip the toy away just before {{dog_name}} latches on (max twice, then let {{dog_object}} win the third attempt).",
        "Decompression time should keep getting shorter — {{dog_name}} should be settling faster after play than in earlier weeks."
      ], why:"We build frustration now so the rules become even more important — following commands in high-arousal states is a much-needed skill. This also gives {{dog_name}} a clear window to jump at people — that annoying thing {{dog_name}} does to visitors now has a dedicated time and place, only when invited.\n\nAdding rules to Play teaches {{dog_name}} that boundaries still apply even in high-arousal states — a rehearsal for real triggers later, where {{dog_name}} will need to keep {{dog_possessive}} head even when aroused.",
      tip:[
        "Play-fighting with {{dog_name}} to start the session is a great way to build energy before the game — pushing {{dog_object}} away, interacting with {{dog_possessive}} face (if comfortable) will raise {{dog_possessive}} energy, which {{dog_name}} then learns to let out in the game.",
        "“Out” means drop it AND leave it. Once {{dog_name}} releases the toy, drop it on the floor in front of {{dog_object}}. If {{dog_name}} tries to get it, re-deliver “out” followed by the lead pops — don’t repeat more than once per command to start. Once {{dog_name}} has held off for a short period (10 seconds to start, building up over time), pick up the toy, immediately move it away, and use your re-engage cue to restart the game."
      ] },
    4: { key:"playWeek67", title:"Play", how:[
        "If Play drive is high, add mild obedience into the game — e.g. waiting in a down while the toy is thrown, rather than reacting the instant it’s released.",
        "You can also start using two leads now (green and red). The red lead is attached to the prong collar, the green lead to a flat collar. With a solid “OUT,” throw the toy and have {{dog_name}} remain in place. To further tap into {{dog_possessive}} drive, switch to the green lead, throw the toy, and release {{dog_name}} to get it — but hold {{dog_object}} back using the green lead. Don’t fully prevent {{dog_name}} from getting the toy, but make {{dog_object}} pull you to it.",
        "By now decompression after play should be quick — {{dog_name}} settling almost immediately is the goal."
      ], why:"This gives {{dog_name}} a clear understanding of when {{dog_name}} can pull through a collar, and when {{dog_name}} can’t. If the only time in the last six weeks {{dog_name}} has pulled through a collar is because you released {{dog_object}} to get a toy, {{dog_name}} learns that pulling isn’t allowed unless released. It also adds another level of competition and frustration to the game, which {{dog_name}} will be loving by now." },
  }},
  looseLeadWalking: { label:"Loose Lead Walking", phases:{
    1: { key:"looseLeadWalking1", title:"Loose Lead Walking (early introduction)", how:[
        "Pick a side for {{dog_name}} to walk on, and stick to it — consistency here matters more than which side you choose.",
        "Use cones or lampposts as A/B reference points.",
        "Walk {{dog_name}} between them on {{dog_possessive}} prong collar and 6ft lead.",
        "If {{dog_name}} walks in front (nose in front of your toes), crosses behind you, or pulls toward something else, use fair lead pressure and turn 180° back to where you came from — no terminal marker here."
      ], why:"Minimal food here keeps walking boring — which is what makes off-lead freedom rewarding by comparison. It also helps teach {{dog_name}} clearly what’s expected while on lead: essentially, to do nothing besides walk next to you.",
      tip:[
        "Keep the food in your back pocket, closest to {{dog_name}} — e.g. if {{dog_name}} walks on your right, keep the kibble in your right back pocket.",
        "This helps {{dog_name}} know where food will come from, and reinforces the preferred walking position."
      ] },
    2: { key:"looseLeadWalking2", title:"Loose Lead Walking", how:[
        "Once reliable, introduce artificial distractions (dropped kibble). If {{dog_name}} puts {{dog_possessive}} head down for the kibble, use lead pressure and turn 180° back, and keep re-presenting the food on the floor until {{dog_name}} learns to ignore it and walk past it.",
        "Once {{dog_name}} has a solid understanding of where {{dog_name}} should be, start using the command “heel” to begin the walk — held until formally released on a “break”/“OK” cue."
      ], why:"Adding synthetic distractions to loose lead walking further instils in {{dog_name}} what the expected behaviour is: head up, eyes front, walk next to you — the environment isn’t {{dog_possessive}} to interact with unless you say so." },
  }},
  collarLeadDesensitisation: { label:"Collar/Lead Desensitisation", phases:{
    1: { key:"collarLeadDesensitisation", title:"Collar/Lead Desensitisation", how:[
        "Put {{dog_possessive}} collar and lead on indoors, at least 5 times per day (more is fine).",
        "Leave it on for 5 minutes, then remove it.",
        "If {{dog_name}} is already tethered on a collar/lead for something else at the time, use a separate collar/lead for this."
      ], why:"This reduces any anticipation of what comes after the collar goes on, so the collar stops being a signal that something (a walk, training, excitement) is about to happen." },
  }},
  thresholdManners: { label:"Threshold Manners (Back Door / Front Door)", phases:{
    1: { key:"backDoorThresholdManners", title:"Back Door Threshold Manners", how:[
        "Stage 1 — threshold manners:",
        "Get {{dog_name}} onto {{dog_possessive}} place bed within view of the back door, tethered.",
        "Walk out, close the door, wait a minute, come back in — walk straight past {{dog_object}}, ignoring {{dog_object}} completely. Once {{dog_name}} has stopped reacting, move to threshold manners.",
        "Approach the open door on lead and stop before crossing. If {{dog_name}} pauses beside you, proceed calmly. If {{dog_name}} tries to get out first, or sits/lies down, return to the start and try again.",
        "Goal: {{dog_name}} remains standing at the open door and waits for you to go first.",
        "Once Stage 1 is solid, progress to Stage 2 — the door knock (or simply opening the back door unannounced):",
        "Set {{dog_name}} on {{dog_possessive}} place bed, untethered. Use a few duration markers to let {{dog_name}} know it’s training time.",
        "If someone can knock or call out before opening, do that first. Once {{dog_name}} is calm, open the door.",
        "If {{dog_name}} reacts in any way (sitting up, looking at the door, barking, etc.), use the Punishment Protocol and return {{dog_object}} to place.",
        "Repeat until {{dog_name}} is no longer reacting.",
        "This becomes a permanent house rule from here on — {{dog_name}} never races you out of any door."
      ], why:"This establishes that every doorway is yours to control, not just the front — helping {{dog_name}} stay settled as you come and go through the back door too, and building the same threshold habit that carries through the rest of the program." },
    2: { key:"frontDoorSetups", title:"Front Door Set-ups", how:[
        "Stage 1 — threshold manners:",
        "Get {{dog_name}} onto {{dog_possessive}} place bed within view of the front door, tethered.",
        "Walk out, close the door, wait a minute, come back in — walk straight past {{dog_object}}, ignoring {{dog_object}} completely. Once {{dog_name}} has stopped reacting, move to threshold manners.",
        "Approach the open door on lead and stop before crossing. If {{dog_name}} pauses beside you, proceed calmly. If {{dog_name}} tries to get out first, or sits/lies down, return to the start and try again.",
        "Goal: {{dog_name}} remains standing at the open door and waits for you to go first.",
        "Once Stage 1 is solid, progress to Stage 2 — the door knock:",
        "Set {{dog_name}} on {{dog_possessive}} place bed, untethered. Use a few duration markers to let {{dog_name}} know it’s training time.",
        "Have someone waiting outside before you start. Once {{dog_name}} is calm, knock on the door or ring the doorbell.",
        "If {{dog_name}} reacts in any way (sitting up, looking at the door, barking, etc.), use the Punishment Protocol and return {{dog_object}} to place.",
        "Repeat until {{dog_name}} is no longer reacting to the door.",
        "To progress further: follow through after the knock and come inside. Same rules apply — if {{dog_name}} reacts, punish and return to place."
      ], why:"This establishes that the doorway is yours to control — helping {{dog_name}} stay settled as you come and go, and preventing jumping up at visitors. Not letting {{dog_name}} sit or lie at the open door keeps anticipation of leaving low, since a sit/lie usually means a dog is expecting a reward — which we want to avoid right before a walk." },
  }},
  place: { label:"Place", phases:{
    1: { key:"place_w1", title:"Place", how:[
        "Walk {{dog_name}} onto the place bed. The moment all four paws are on it, use your duration marker (e.g. \"good\") calmly — no food reward just for getting onto the bed. This keeps place feeling normal and boring, not a high-reward trick.",
        "Build short duration on the bed with mild distraction, using food sparingly and only via the duration marker — mark first, then go and get the food, then deliver it.",
        "Add a back-tie if {{dog_name}} is making errors (getting up, leaving the bed).",
        "If using food to reward duration, don’t deliver it too close after an error — this risks rewarding the recovery rather than the calm state.",
        "To release: once {{dog_name}} is settled, give the release cue (“break”/“OK”) and throw a single piece of kibble on the floor away from the bed — keep the release calm and low-key, unlike the several pieces used outside during Loose Lead Walking.",
        "After {{dog_name}} has had the kibble, call {{dog_object}} back to heel or back onto the place bed — this creates a clear, repeatable pattern of when {{dog_name}} has freedom and when that freedom time is over."
      ], why:"This starts teaching {{dog_name}} impulse control very early on into what will be {{dog_possessive}} “new normal.” Skipping food for simply getting onto the bed keeps place feeling like a normal, calm behaviour rather than a trick worth getting excited over, while a paired release cue makes it just as clear to {{dog_name}} when {{dog_object}} is free to make {{dog_possessive}} own choices — the same principle used in Loose Lead Walking, where “heel” means fall in and walk, and “break”/“OK” means {{dog_name}} is at liberty.",
      tip:[
        "Use a raised place bed where possible — there’s a psychological effect to physically getting up onto something and back down off it.",
        "If you’re away from home and taking the place bed isn’t feasible, use a coat or hoodie instead, so {{dog_name}} still has a clear target area."
      ] },
    2: { key:"place_w23", title:"Place", how:[
        "Continue daily duration work with mild distraction; increase the distraction level if {{dog_name}} is doing well.",
        "Consider a back-tie if you can’t stay fully attentive.",
        "Introduce Formal Place Training as the evening variant — a calmer, more deliberate decompression session distinct from the quicker daytime touchpoints."
      ], why:"This helps teach {{dog_name}} that after play or other high-arousal states, the crate isn’t the only place {{dog_name}} can relax and unwind. Dogs do most of their learning when asleep, so the calmer we can help {{dog_name}} be in the house, the quicker {{dog_name}} will learn whatever it is we’re teaching {{dog_object}}." },
    3: { key:"place_w45", title:"Place", how:[
        "Formal Place Training becomes the primary decompression method, replacing the crate entirely.",
        "Start spacing out food delivery for duration rewards (10–15 minutes between rewards by this point) — build patience rather than rewarding on a fixed schedule.",
        "Correct with lead pressure if {{dog_name}} breaks position.",
        "Occasionally drop food on purpose as a deliberate “test” of duration and impulse control."
      ], why:"Impulse control here is a huge game changer if we want {{dog_name}} to be calm. During Play, we’re teaching {{dog_name}} that there are clear windows for expression; through everything else, we’re teaching structure. Impulse control is one of the most important skills a dog can learn to be calm — imagine a dog that sees a squirrel and doesn’t immediately bolt: that’s impulse control." },
    4: { key:"place_w67", title:"Place", how:[
        "Place work should now be easy and low-effort to maintain.",
        "Deliberately ramp up distractions to keep testing reliability.",
        "If {{dog_name}} is reliably calm at liberty, freedom can be allowed instead of confinement during downtime."
      ], why:"{{dog_name}} has earned this freedom by proving {{dog_name}} can be calm in the house, and can decompress quickly following high-emotion states. As long as that continues, liberty can be granted. If old behaviours start slipping back through, return to confinement or tethering to stop them creeping back in." },
  }},
  recall: { label:"Recall", phases:{
    1: { key:"recallPhase1", title:"Recall (Phase 1)", how:[
        "Switch {{dog_name}} onto {{dog_possessive}} flat collar. Use the prong collar with a flexi lead or long line. Let {{dog_name}} wander further than before. When ready, recall {{dog_name}}, using frequent, very gentle taps on the lead to guide {{dog_object}} back — don’t stop until {{dog_name}} reaches your feet. Mark, move, pay (1 in 5 a jackpot)."
      ], why:"Building a solid recall is essential for {{dog_possessive}} safety and the safety of others — it’s the single most important skill for off-lead time. Phase 1’s frequent gentle taps teach {{dog_name}} how to “turn off” the constant, mildly annoying pressure." },
    2: { key:"recallPhase2", title:"Recall (Phase 2)", how:[
        "Switch back to the prong collar. Instead of frequent gentle taps continuing until {{dog_name}} arrives, use slightly firmer lead taps (still frequent) that stop the instant {{dog_name}} turns, lifts {{dog_possessive}} head, and starts moving toward you."
      ], why:"Phase 2 starts teaching that acknowledging the recall quickly and early is what turns the pressure off, rather than the eventual return alone." },
    3: { key:"phase3Recall", title:"Phase 3 Recall", how:[
        "Recall should now be fairly reliable. Don’t set this phase up artificially — simply continue recalling {{dog_name}} during normal life.",
        "The first time {{dog_name}} doesn’t respond immediately, use one very firm/harsh lead pop and guide {{dog_object}} back — one pop should be enough to get full attention.",
        "Mark and pay when {{dog_name}} arrives (even if a correction was needed) — jackpot the first few times."
      ], why:"Done correctly, this has a major impact on recall reliability. If the correction is significant enough, {{dog_name}} will want to avoid it in future — and that avoidance reinforces recall further, since coming back becomes the more comfortable choice." },
  }},
  recallLooseLead: { label:"Recall & Loose Lead Walking (combined drill)", phases:{
    1: { key:"recallLooseLead", title:"Recall & Loose Lead Walking", how:[
        "Continue Phase 2 recall and Loose Lead Walking together at the day’s location, layering in the location’s natural distractions."
      ], why:"Combining these two skills under real environmental distraction is the bridge between isolated training exercises and the trigger work coming in Weeks 6&7. This gives an easy route into teaching {{dog_name}} that recall is still non-negotiable no matter where {{dog_name}} is or what the distraction is, without being so hard {{dog_name}} might fail." },
  }},
  punishmentProtocol: { label:"Punishment Protocol", phases:{
    1: { key:"punishmentProtocol", title:"Punishment Protocol", how:[
        "Rehearsal target: something {{dog_name}} likes doing but shouldn’t — counter surfing, bin diving, etc. — never a real reactive trigger at this stage. Set the target up away from {{dog_name}} and walk {{dog_object}} toward it, then work through the steps below.",
        "1. Mark. A firm “bad”/“stop” followed by two firm lead pops. Avoid a word you’ve already overused trying to stop {{dog_name}} — most of these have no power left.",
        "2. Interrupt. Block progress of the unwanted behaviour completely using the lead — {{dog_name}} cannot be allowed to find success here.",
        "3. Reiteration. Repeat step 1 twice more, with disappointed theatrics between each delivery. Keep {{dog_name}} moving throughout so {{dog_object}} doesn’t start offering a preferred behaviour like sit to escape the pressure.",
        "4. Isolation. Tether {{dog_name}} somewhere still in view of the trigger/setup but not close enough to reach it. Lay on the disappointed theatrics and tone once more, then shrug your shoulders and walk away. Steps 1–4 should all be delivered at {{dog_possessive}} eye level, making good eye contact.",
        "5. Rumination. Give {{dog_name}} time in isolation to process what happened — around a minute to start. Don’t interact during this time.",
        "6. Reconciliation. Return and make up with {{dog_name}}, on your terms, not {{dog_possessive}}. Make sure you’re friends again, with plenty of affection.",
        "7. Re-present. Re-present {{dog_name}} to the setup or trigger. If {{dog_name}} has understood, {{dog_object}} won’t go near it a second time. Give it plenty of time during practice. If {{dog_name}} fails, go straight back to step 1 and cycle through again until the trigger stops drawing {{dog_object}} in. After 3 cycles with no improvement, increase something — the level of correction, the drama/tone of your voice, or the isolation period."
      ], why:"Rehearsed first on something {{dog_name}} likes but shouldn’t be doing — never a real reactive trigger — this is the fairest way to teach {{dog_name}} that a wrong decision has consequences, before it’s ever used live.",
      tip:[
        "Get on {{dog_possessive}} eye level and make eye contact while delivering the punishment marker, lead pops, and disappointed theatrics — this is supposed to be emotional for {{dog_name}}.",
        "Once {{dog_name}} is tethered, really lay on the disappointment — a shrug of the shoulders, a big sigh as you walk away. It helps to have a few phrases lined up. Take this slowly — don’t rush through the first steps."
      ] },
    2: { key:"punishmentProtocolAway", title:"Punishment Protocol (Away From Home)", how:[
        "Move Punishment Protocol rehearsal away from home (still a controlled setup, with somewhere to tether in sight of it)."
      ], why:"Practicing the Punishment Protocol away from home teaches {{dog_name}} that consequences apply everywhere, not just at home." },
  }},
  freedomWalk: { label:"Freedom Walk with Long-Line", phases:{
    1: { key:"freedomWalk", title:"Freedom Walk with Long-Line", how:[
        "Switch from a flexi lead to a long training line, letting {{dog_name}} experience real freedom.",
        "Practice recall, falling back on the Phase 3 harsh correction if needed — by this point it should rarely be necessary."
      ], why:"{{dog_name}} will start to love this new freedom. With freedom comes more distractions and more chances to blow off recall — this is still all practice for real triggers, so keep training exactly as before." },
  }},
  triggerWork: { label:"Trigger Work", phases:{
    1: { key:"triggerWork", title:"Trigger Work", how:[
        "Start looking for real triggers while {{dog_name}} is on a long line.",
        "Lean on recall more than the Redirect Exercise to pull {{dog_name}} away from triggers.",
        "Always mark, move, and pay once {{dog_name}} returns to you."
      ], why:"This is the payoff stage where isolated skills (recall, redirect, punishment protocol) meet a genuine trigger for the first time." },
  }},
};

/* Resolve a family+phase pair to the underlying EX-compatible key.
   This is the single place that turns "Play, phase 2" into concrete
   exercise content. To move an exercise phase to a different week,
   you never edit this — you only change which (family, phase) pair
   a given week/session points to (see PHASES and the genWeekXDays
   functions below). */
function libKey(family, phase){
  const fam = EXERCISE_LIBRARY[family];
  if(!fam) throw new Error(`EXERCISE_LIBRARY: unknown family "${family}"`);
  const ph = fam.phases[phase];
  if(!ph) throw new Error(`EXERCISE_LIBRARY: unknown phase ${phase} for family "${family}"`);
  return ph.key;
}

/* EX is auto-derived from EXERCISE_LIBRARY so every existing lookup
   (EX[key].title / .how / .why / .tip) keeps working unchanged. */
const EX = {};
Object.values(EXERCISE_LIBRARY).forEach(family=>{
  Object.values(family.phases).forEach(ph=>{
    EX[ph.key] = { title: ph.title, how: ph.how, why: ph.why };
    if(ph.tip) EX[ph.key].tip = ph.tip;
  });
});

/* ============================================================
   SESSION RULE LIBRARY
   Single source of truth for the "house rules" that bookend a
   session — crate/confinement time, wind-down time, settling for
   the night, etc. Same method as EXERCISE_LIBRARY: grouped into
   families, each holding its wording as numbered phases (1, 2, 3...)
   that line up with the same week blocks as the exercise phases
   (phase 1 = Week 1, phase 2 = Weeks 2 & 3, phase 3 = Weeks 4 & 5,
   phase 4 = Weeks 6 & 7).

   These used to live in each phase's `weekRules` array and only
   showed up in the Info modal. They're now attached directly to
   individual sessions as pre-session / post-session items (see
   SESSION_RULES_LIBRARY below) — the Info modal no longer shows them.

   TO MOVE A RULE TO A DIFFERENT WEEK:
   Don't edit this. Change which (family, phase) pair
   SESSION_RULES_LIBRARY points a given day/session's pre[] or
   post[] at.
   ============================================================ */
const RULE_LIBRARY = {
  confinement: { label:'Crate Time (Daytime confinement)', phases:{
    1: { key:'confinement_w1', title:'Crate Time', body:'Keep {{dog_name}} crated or confined between sessions for calm structure.' },
    2: { key:'confinement_w23', title:'Crate Time', body:'{{dog_name}} remains crated or in considerable confinement.' },
    3: { key:'confinement_w45', title:'Crate Time', body:'Crate or confinement maintained.' },
    4: { key:'confinement_w67', title:'Crate Time', body:'Crate or confinement, though if {{dog_name}} is reliably calm at liberty, freedom can be allowed.' },
  }},
  windDown: { label:'Wind-Down Time (Evening rest period)', phases:{
    1: { key:'windDown_w1', title:'Wind-Down Time', body:'Calm interaction or structured tether time between sessions to help {{dog_name}} unwind — no play, no chatting during rest periods.' },
    2: { key:'windDown_w23', title:'Wind-Down Time', body:'Formal Place Training now doubles as the calm decompression period.' },
    3: { key:'windDown_w45', title:'Wind-Down Time', body:'Formal Place Training is now the primary decompression tool: spacing out food delivery, building patience.' },
    4: { key:'windDown_w67', title:'Wind-Down Time', body:'Ramp up distractions intentionally during optional Place work to keep testing reliability.' },
  }},
  settleForNight: { label:'Settle for the Night (End of day)', phases:{
    1: { key:'settleForNight_w1', title:'Settle for the Night', body:'Calm crate, tether, or cuddle time once settled.' },
    2: { key:'settleForNight_w23', title:'Settle for the Night', body:'Cuddle time is fine, provided {{dog_name}} is calm.' },
    3: { key:'settleForNight_w45', title:'Settle for the Night', body:'Cuddle up, providing {{dog_name}} is calm.' },
    4: { key:'settleForNight_w67', title:'Settle for the Night', body:'Cuddle away, if calm.' },
  }},
};
/* Resolve a family+phase pair to the underlying rule key — the same
   role libKey() plays for EXERCISE_LIBRARY. */
function ruleKey(family, phase){
  const fam = RULE_LIBRARY[family];
  if(!fam) throw new Error(`RULE_LIBRARY: unknown family "${family}"`);
  const ph = fam.phases[phase];
  if(!ph) throw new Error(`RULE_LIBRARY: unknown phase ${phase} for family "${family}"`);
  return ph.key;
}
/* RULES is auto-derived from RULE_LIBRARY, same pattern as EX. */
const RULES = {};
Object.values(RULE_LIBRARY).forEach(family=>{
  Object.values(family.phases).forEach(ph=>{
    RULES[ph.key] = { title: ph.title, body: ph.body };
  });
});
/* Look up a pre/post-session item by key, whichever library it came
   from — an exercise (e.g. Back Door Threshold Manners) or a rule
   (e.g. Crate Time). Their key namespaces never collide. */
function prePostItem(key){
  return EX[key] || RULES[key];
}

/* ============================================================
   SESSION RULES LIBRARY
   States which pre-session and post-session item(s) attach to each
   session, per main-plan phase. Keyed by phaseId, then by session
   ('morning' / 'afternoon' / 'evening'), holding a pre[] and post[]
   array of (family, phase) references resolved via ruleKey()/libKey().
   Both arrays are the SAME for every day within a phase by default —
   add a day-specific override in SESSION_RULES_OVERRIDES below if a
   single day ever needs to differ.

   Default wiring (matches the program as originally written):
   - post-morning   = Crate Time (the old "Daytime" rule)
   - post-afternoon = Wind-Down Time (the old "Evening" rule)
   - post-evening   = Settle for the Night (the old "End of day" rule)
   - pre-* (every session) = Back Door Threshold Manners, but ONLY
     during whichever phase first introduces it (Newton's Cradle if
     it's being run, otherwise Week 1) — this stays a runtime check
     (see sessionRuleItems() below) since it depends on the person's
     onboarding choices, not a fixed week.

   TO SWAP A RULE IN/OUT OF A SESSION:
   Edit the relevant phase/session's pre[] or post[] array below —
   e.g. to remove the evening wind-down reminder in Weeks 4 & 5,
   set SESSION_RULES_LIBRARY['weeks4-5'].evening.post = [].
   ============================================================ */
const SESSION_RULES_LIBRARY = {
  week1: {
    morning:  { pre:[], post:[ruleKey('confinement',1)] },
    afternoon:{ pre:[], post:[ruleKey('windDown',1)] },
    evening:  { pre:[], post:[ruleKey('settleForNight',1)] },
  },
  'weeks2-3': {
    morning:  { pre:[], post:[ruleKey('confinement',2)] },
    afternoon:{ pre:[], post:[ruleKey('windDown',2)] },
    evening:  { pre:[], post:[ruleKey('settleForNight',2)] },
  },
  'weeks4-5': {
    morning:  { pre:[], post:[ruleKey('confinement',3)] },
    afternoon:{ pre:[], post:[ruleKey('windDown',3)] },
    evening:  { pre:[], post:[ruleKey('settleForNight',3)] },
  },
  'weeks6-7': {
    morning:  { pre:[], post:[ruleKey('confinement',4)] },
    afternoon:{ pre:[], post:[ruleKey('windDown',4)] },
    evening:  { pre:[], post:[ruleKey('settleForNight',4)] },
  },
};
/* Optional per-day overrides, keyed the same way as
   SESSION_LOCATION_LIBRARY: SESSION_RULES_OVERRIDES[phaseId][day][sessionKey]
   = { pre:[...], post:[...] }. Empty by default — add entries here
   for one-off exceptions without touching the phase-wide defaults above. */
const SESSION_RULES_OVERRIDES = {};

/* Resolve the pre[] or post[] item keys for a given phase/day/session,
   applying any per-day override, then layering in the dynamic
   threshold-manners introduction on top of whatever pre[] it finds. */
/* Crate follows every Play session (afternoon & evening — Play never
   runs in the morning) for the program's first four calendar weeks
   (days 1–28), as a permanent default — regardless of any plan import. */
function isCrateDefaultSession(day, sessionKey){
  return (sessionKey==='afternoon' || sessionKey==='evening') && day<=28;
}
function sessionRuleItems(phaseId, day, sessionKey, slot){
  const plan = STATE.planImport;
  const sessOv = plan && plan.days && plan.days[day] && plan.days[day][sessionKey];
  if(sessOv && sessOv[slot] !== undefined){
    return sessOv[slot].map(([f,p])=>anyKey(f,p));
  }
  const override = SESSION_RULES_OVERRIDES[phaseId] && SESSION_RULES_OVERRIDES[phaseId][day] && SESSION_RULES_OVERRIDES[phaseId][day][sessionKey];
  const cfg = SESSION_RULES_LIBRARY[phaseId] && SESSION_RULES_LIBRARY[phaseId][sessionKey];
  const base = (override && override[slot]) ? override[slot].slice() : ((cfg && cfg[slot]) ? cfg[slot].slice() : []);
  if(slot==='pre' && phaseId === thresholdIntroducerPhaseId()){
    base.unshift(libKey('thresholdManners',1));
  }
  if(slot==='post' && isCrateDefaultSession(day, sessionKey)){
    base.unshift(libKey('crate',1));
  }
  return base;
}

const MAIN_PHASE_ORDER = ['week1','weeks2-3','weeks4-5','weeks6-7'];

/* ============================================================
   WEEK EXTENSIONS
   Each phase can have any number of extra 1-week blocks appended.
   BASE_PHASE_DAYS is a frozen snapshot of each phase's original
   (un-extended) day data, captured once at load. Extension weeks
   are built by cloning the last 7 days of that original data
   (i.e. the phase's final real week) and re-numbering them.
   ============================================================ */
const BASE_PHASE_DAYS = {};
Object.keys(PHASES).forEach(pid=>{ BASE_PHASE_DAYS[pid] = JSON.parse(JSON.stringify(PHASES[pid].days)); });

function computeExtendedDays(phaseId){
  const base = BASE_PHASE_DAYS[phaseId];
  const ext = (STATE.extensions && STATE.extensions[phaseId]) || 0;
  const out = base.map(d=>JSON.parse(JSON.stringify(d)));
  if(ext<=0) return out;
  const lastWeek = base.slice(-7);
  for(let w=0; w<ext; w++){
    lastWeek.forEach(tmpl=>{ out.push(JSON.parse(JSON.stringify(tmpl))); });
  }
  return out;
}
/* Rebuilds PHASES[*].days from BASE_PHASE_DAYS + STATE.extensions and
   re-numbers the 'day' field: pre-requisite phases number independently
   from 1; main phases number continuously across MAIN_PHASE_ORDER.
   Cheap to call, so it's called at the top of every render() to
   guarantee PHASES always matches STATE.extensions. */
function applyExtensions(){
  if(!STATE.extensions) STATE.extensions = {};
  ['prePhaseA','prePhaseB'].forEach(pid=>{
    const days = computeExtendedDays(pid);
    days.forEach((d,i)=>{ d.day = i+1; });
    PHASES[pid].days = days;
  });
  let nextDay = 1;
  MAIN_PHASE_ORDER.forEach(pid=>{
    const days = computeExtendedDays(pid);
    days.forEach(d=>{ d.day = nextDay; nextDay++; });
    PHASES[pid].days = days;
  });
}
function phaseWeekCount(phaseId){ return Math.ceil(PHASES[phaseId].days.length/7); }
/* Resolve a (family, phase) pair whether it names an EXERCISE_LIBRARY
   family or a RULE_LIBRARY family — used for plan-import overrides,
   which can reference either kind of item. The two libraries never
   share a family name. */
function anyKey(family, phase){
  if(EXERCISE_LIBRARY[family]) return libKey(family, phase);
  if(RULE_LIBRARY[family]) return ruleKey(family, phase);
  throw new Error(`anyKey: unknown family "${family}"`);
}
/* ============================================================
   PLAN IMPORT  (schema v5 — day-keyed, with exercise combos)
   Applies a trainer-authored plan (STATE.planImport, produced by the
   separate Trainer Planner app) on top of the default program. Runs
   every render, right after applyExtensions() rebuilds PHASES[*].days
   from the frozen defaults — so this always starts from a clean slate
   and only touches what's actually overridden.

   Shape: { v:5, days:{ [dayNumber]: {
              morning:{training,pre,post}, afternoon:{...}, evening:{...},
              locations
            } } }
   dayNumber is the default (unextended) 1–49 numbering used across
   the whole main journey. Each session has its OWN pre/post — pre/post
   are flat lists of refs (each rendered as its own line, matching how
   Golden/house rules always worked); training is a list of GROUPS —
   every group is itself a list of one-or-more refs, and everything
   inside one group renders combined on a single line ("Redirect &
   Loose Lead Walking"); separate groups render as separate lines. Play
   and Place are ordinary exercises now (families 'play'/'place' in
   EXERCISE_LIBRARY) — nothing forces them into a session; they only
   appear where a group's refs actually include them, same as any
   other exercise. locations overrides sessionLocations for that day.
   Anything not covered by the import falls back to the default
   program untouched.
   ============================================================ */
function applyPlanOverrides(){
  const plan = STATE.planImport;
  if(!plan) return;

  if(plan.days){
    MAIN_PHASE_ORDER.forEach(pid=>{
      PHASES[pid].days.forEach(d=>{
        const ov = plan.days[d.day];
        if(!ov) return;
        ['morning','afternoon','evening'].forEach(sk=>{
          const sessOv = ov[sk];
          if(!sessOv || !sessOv.training || !d.sessions || !d.sessions[sk]) return;
          const newTrainingComps = sessOv.training.map(group=>({ type:'training', ex: group.map(([f,p])=>libKey(f,p)) }));
          let inserted = false;
          const rebuilt = [];
          d.sessions[sk].forEach(c=>{
            if(c.type==='training'){
              if(!inserted){ rebuilt.push(...newTrainingComps); inserted = true; }
              // drop any further default training components — a single
              // slot only ever has one by default, but this stays safe either way
            } else {
              rebuilt.push(c);
            }
          });
          if(!inserted) rebuilt.push(...newTrainingComps);
          d.sessions[sk] = rebuilt;
        });
        if(ov.locations){
          d.sessionLocations = Object.assign({}, d.sessionLocations, ov.locations);
          d.location = d.sessionLocations.morning;
        }
      });
    });
  }

  // Recompute each main phase's exercise carousel to reflect training overrides
  MAIN_PHASE_ORDER.forEach(pid=>{
    const phase = PHASES[pid];
    const keys = new Set();
    if(phase.dailyTaskKey) keys.add(phase.dailyTaskKey);
    phase.days.forEach(d=>{
      Object.values(d.sessions||{}).forEach(comps=>{
        comps.forEach(c=>{ if(c.type==='training') c.ex.forEach(k=>keys.add(k)); });
      });
    });
    phase.exerciseKeys = [...keys];
  });
}
/* Decodes and validates a base64 plan code, throwing a descriptive
   error if it's not readable or references an unknown family/phase.
   Shared by both import entry points (Welcome-screen full import and
   Settings plan-code import). */
function decodeAndValidatePlan(raw){
  const json = decodeURIComponent(escape(atob(raw)));
  const plan = JSON.parse(json);
  if(!plan || typeof plan !== 'object' || plan.v !== 5) throw new Error('unsupported plan version');
  if(plan.days){
    Object.values(plan.days).forEach(dayOv=>{
      ['morning','afternoon','evening'].forEach(sk=>{
        const sessOv = dayOv[sk];
        if(!sessOv) return;
        (sessOv.training||[]).forEach(group=>group.forEach(([f,p])=>libKey(f,p)));
        (sessOv.pre||[]).forEach(([f,p])=>anyKey(f,p));
        (sessOv.post||[]).forEach(([f,p])=>anyKey(f,p));
      });
    });
  }
  return plan;
}

/* Extending is only safe while the phase isn't complete yet: the new
   week is always appended right after the phase's current last day,
   and completedCount (a raw index into the flat day sequence) only
   stays meaningful if nothing already-completed sits past that point. */
function canExtendPhase(phaseId, allDays){
  return phaseStatus(phaseId, allDays) !== 'complete';
}
function canShrinkPhase(phaseId, allDays){
  const ext = (STATE.extensions && STATE.extensions[phaseId]) || 0;
  if(ext<=0) return false;
  const status = phaseStatus(phaseId, allDays);
  if(status==='complete') return false;
  const start = phaseStartIndex(phaseId, allDays);
  const days = PHASES[phaseId].days;
  const boundaryBeforeLastWeek = start + (days.length - 7);
  return STATE.completedCount <= boundaryBeforeLastWeek;
}
