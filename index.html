/* ============================================================
   DATE HELPERS (DST-safe: operate on local calendar components)
   ============================================================ */
function parseISODate(str){ const [y,m,d]=str.split('-').map(Number); return new Date(y, m-1, d); }
function fmtISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDaysISO(iso, n){ const d=parseISODate(iso); d.setDate(d.getDate()+n); return fmtISO(d); }
function todayISO(){ return fmtISO(new Date()); }
function fmtDisplay(iso){
  const d = parseISODate(iso);
  return d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
}
function nextMondays(count){
  const out=[];
  const d = new Date();
  d.setHours(0,0,0,0);
  const dow = d.getDay(); // 0=Sun..6=Sat
  let addToMonday = (8 - dow) % 7; // days until next Monday
  if(dow===1) addToMonday = 0; // today is Monday, include it
  const first = new Date(d); first.setDate(first.getDate()+addToMonday);
  for(let i=0;i<count;i++){
    const m = new Date(first); m.setDate(m.getDate() + i*7);
    out.push(fmtISO(m));
  }
  return out;
}

/* ============================================================
   JOURNEY SEQUENCING — flat ordered list of every day across
   whichever phases are active, used for global one-at-a-time
   gating and date computation.
   ============================================================ */
// Derivation per the confirmed skip logic in the scope doc
function activePhaseIdsForFlags(handDone, cradleDone){
  const ids=[];
  if(handDone===false){ ids.push('prePhaseA'); ids.push('prePhaseB'); }
  else if(handDone===true && cradleDone===false){ ids.push('prePhaseB'); }
  // hand===true && cradle===true -> neither runs
  MAIN_PHASE_ORDER.forEach(id=>ids.push(id));
  return ids;
}
function activePhaseIdsExplicit(){
  return activePhaseIdsForFlags(STATE.handFeedingAlreadyDone, STATE.newtonsCradleAlreadyDone);
}
function buildAllDaysForFlags(handDone, cradleDone){
  const flat=[];
  activePhaseIdsForFlags(handDone, cradleDone).forEach(pid=>{
    PHASES[pid].days.forEach(dayObj=>{ flat.push({ phaseId:pid, dayObj }); });
  });
  return flat;
}
function buildAllDays(){
  return buildAllDaysForFlags(STATE.handFeedingAlreadyDone, STATE.newtonsCradleAlreadyDone);
}
function computeAutoCompletedCount(startDate, handDone, cradleDone){
  const allDays = buildAllDaysForFlags(handDone, cradleDone);
  const today = todayISO();
  let count = 0;
  for(let i=0;i<allDays.length;i++){
    const sched = addDaysISO(startDate, i);
    if(sched < today) count = i+1; else break;
  }
  return count;
}
function lastMondayISO(){
  const d = new Date(); d.setHours(0,0,0,0);
  const dow = d.getDay(); // 0=Sun..6=Sat
  const diff = dow===0 ? 6 : dow-1;
  d.setDate(d.getDate()-diff);
  return fmtISO(d);
}
/* The phase where Back Door Threshold Manners is first introduced:
   Newton's Cradle if it's running this journey, otherwise Week 1 (Hand Feeding is always excluded). */
function thresholdIntroducerPhaseId(){
  return activePhaseIdsExplicit().includes('prePhaseB') ? 'prePhaseB' : 'week1';
}
function thresholdRuleKind(phaseId){
  if(phaseId==='prePhaseA') return null;
  const introducer = thresholdIntroducerPhaseId();
  if(phaseId===introducer) return 'intro';
  if(phaseId==='prePhaseB') return null; // not active this journey if we got here
  return 'reminder'; // any other main phase after the introducer
}
function getExerciseKeysForPhase(phaseId){
  const keys = [...PHASES[phaseId].exerciseKeys];
  if(phaseId === thresholdIntroducerPhaseId()) keys.push(libKey('thresholdManners',1));
  return keys;
}
/* Check-in: fires at the end of every real calendar week of the main plan (days 7/14/21/28/35/42/49),
   and at the end of Newton's Cradle (day 7 of that phase). Never after Hand Feeding. */
function checkinForCompletedDay(phaseId, day){
  const phase = PHASES[phaseId];
  if(phase.kind === 'pre'){
    if(phaseId === 'prePhaseB'){
      const lastDay = phase.days[phase.days.length-1].day;
      if(day === lastDay-1){
        const content = checkinKey('prePhaseB', 1);
        return { title: content.title, items: content.items, dueNote:`Record this tomorrow, on Day ${lastDay} \u2014 the final day of Newton\u2019s Cradle.` };
      }
    }
    return null;
  }
  if(day % 7 !== 6) return null;
  const finalDay = day + 1;
  // Find which (possibly-extended) main phase this day falls in.
  let mainPhaseId=null, phaseFirstDay=null;
  for(const id of MAIN_PHASE_ORDER){
    const days = PHASES[id].days;
    const first = days[0].day, last = days[days.length-1].day;
    if(finalDay>=first && finalDay<=last){ mainPhaseId=id; phaseFirstDay=first; break; }
  }
  if(!mainPhaseId) return null;
  const weekWithinPhase = Math.floor((finalDay-phaseFirstDay)/7) + 1;
  const content = checkinKey(mainPhaseId, weekWithinPhase);
  if(!content) return null;
  const totalWeeksInPhase = phaseWeekCount(mainPhaseId);
  const label = displayedLabel(mainPhaseId);
  const title = totalWeeksInPhase>1 ? `${label} check-in \u2014 Week ${weekWithinPhase} of ${totalWeeksInPhase}` : `${label} check-in`;
  const dueNote = `Record these tomorrow, on Day ${finalDay} \u2014 the final day of the week.`;
  return { title, items: content.items, dueNote };
}
function phaseStartIndex(phaseId, allDays){
  const idx = allDays.findIndex(d=>d.phaseId===phaseId);
  return idx;
}
function displayedLabel(phaseId){
  // Dynamically walks the active phase sequence, tallying week counts
  // (which grow with extensions) to find this phase's week number(s).
  // This naturally reproduces the hand/cradle skip-shift the old fixed
  // maps did, while also accounting for any extension weeks added.
  const activeIds = activePhaseIdsExplicit();
  let startWeek = 1;
  for(const pid of activeIds){
    const wc = phaseWeekCount(pid);
    if(pid===phaseId){
      const endWeek = startWeek + wc - 1;
      if(wc===1) return `Week ${startWeek}`;
      if(wc===2) return `Weeks ${startWeek} & ${endWeek}`;
      return `Weeks ${startWeek}-${endWeek}`;
    }
    startWeek += wc;
  }
  return PHASES[phaseId].baseLabel || PHASES[phaseId].title;
}
function phaseStatus(phaseId, allDays){
  const start = phaseStartIndex(phaseId, allDays);
  if(start===-1) return 'skipped';
  const count = PHASES[phaseId].days.length;
  const end = start+count; // exclusive
  if(STATE.completedCount >= end) return 'complete';
  if(STATE.completedCount >= start) return 'active';
  return 'locked';
}
function dayGlobalIndex(phaseId, dayNumber, allDays){
  return allDays.findIndex(d=>d.phaseId===phaseId && d.dayObj.day===dayNumber);
}
function dayStatus(globalIdx){
  if(globalIdx < STATE.completedCount) return 'complete';
  if(globalIdx === STATE.completedCount) return 'active';
  return 'locked';
}
function dayScheduledDate(globalIdx){
  if(!STATE.startDate) return null;
  return addDaysISO(STATE.startDate, globalIdx);
}
function canCompleteDay(globalIdx){
  if(dayStatus(globalIdx)!=='active') return false;
  if(STATE.settings.dateGateEnabled===false) return true;
  const sched = dayScheduledDate(globalIdx);
  if(!sched) return true;
  return todayISO() >= sched;
}
/* Which day should be auto-expanded when a phase page is freshly opened:
   prefer the day scheduled for today; otherwise fall back to whichever
   day in this phase is currently active. Null if neither applies. */
function findDefaultOpenDay(phaseId){
  const allDays = buildAllDays();
  const phase = PHASES[phaseId];
  const today = todayISO();
  for(const d of phase.days){
    const gIdx = dayGlobalIndex(phaseId, d.day, allDays);
    if(gIdx===-1) continue;
    if(dayScheduledDate(gIdx) === today) return d.day;
  }
  for(const d of phase.days){
    const gIdx = dayGlobalIndex(phaseId, d.day, allDays);
    if(gIdx===-1) continue;
    if(dayStatus(gIdx)==='active') return d.day;
  }
  return null;
}

function renderJourney(){
  const allDays = buildAllDays();
  const ids = activePhaseIdsExplicit();
  const nodes = ids.map(pid=>{
    const phase = PHASES[pid];
    const status = phaseStatus(pid, allDays);
    const label = displayedLabel(pid);
    const dayCount = phase.days.length;
    const ext = (STATE.extensions && STATE.extensions[pid]) || 0;
    const canExtend = canExtendPhase(pid, allDays);

  }).join('');
  return `

function resolveLocationLabel(baseName){
  const loc = LOC_BY_NAME[baseName];
  if(!loc) return baseName;
  const assigned = STATE.locationAssignments[loc.id];
  return assigned ? assigned : baseName;
}
function prePostRowHtml(key, kind){
  const item = prePostItem(key);
  if(!item) return '';
  const body = item.body || (item.how && item.how[0]) || '';
  const tagClass = kind==='pre' ? 'tag-pre' : 'tag-post';
  const tagLabel = kind==='pre' ? 'Pre' : 'Post';
  return `<div class="component pre-post"><div class="dot"></div><div><div class="ctext"><span class="tag ${tagClass}">${tagLabel}</span><b>${esc(P(item.title))}</b></div><div class="cloc">${esc(P(body))}</div></div></div>`;
}
function sessionBlockHtml(sessionKey, comps, phase, dayObj, isPre){
  const label = sessionKey.charAt(0).toUpperCase()+sessionKey.slice(1);
  let compsHtml;
  if(isPre){
    const c = comps[0];
    const setCount = c.setCount ? ` \u2014 ${c.setCount} sets` : '';
    const loc = resolveSessionLocationValue(c.location||dayObj.location);
    compsHtml = `<div class="component"><div class="dot"></div><div><div class="ctext"><b>${esc(EX[c.ex[0]].title)}</b>${esc(setCount)}</div><div class="cloc">${esc(loc)}</div></div></div>`;
  } else {
    compsHtml = comps.map(c=>{
      const info = componentLabel(c, phase);
      let loc;
      if(c.ex.length===1 && KEY_FAMILY[c.ex[0]]==='play'){
        loc = resolveLocationLabel(PLAY_LOCATION);
      } else if(c.ex.length===1 && KEY_FAMILY[c.ex[0]]==='place'){
        loc = PLACE_LOCATION;
      } else {
        const bySession = dayObj.sessionLocations;
        loc = resolveSessionLocationValue(bySession ? bySession[sessionKey] : dayObj.location);
      }
      return `<div class="component"><div class="dot"></div><div><div class="ctext"><b>${esc(info.title)}</b> \u2014 ${esc(info.sub)}</div><div class="cloc">${esc(loc)}</div></div></div>`;
    }).join('');
  }
  const preKeys = sessionRuleItems(phase.id, dayObj.day, sessionKey, 'pre');
  const postKeys = sessionRuleItems(phase.id, dayObj.day, sessionKey, 'post');
  const preHtml = preKeys.map(k=>prePostRowHtml(k,'pre')).join('');
  const postHtml = postKeys.map(k=>prePostRowHtml(k,'post')).join('');
  return `<div class="session-block"><div class="session-name">${esc(label)}</div><div class="component-chain">${preHtml}${compsHtml}${postHtml}</div></div>`;
}

function phaseLocationsUsed(phaseId){
  const phase = PHASES[phaseId];
  if(phase.kind==='pre'){
    if(phaseId==='prePhaseA'){
      const ranges = [];
      let cur=null;
      phase.days.forEach(d=>{
        if(cur && cur.value===d.location){ cur.to=d.day; }
        else { cur={value:d.location, from:d.day, to:d.day}; ranges.push(cur); }
      });
      return ranges.map(r=>{
        const loc = typeof r.value==='number' ? LOC_BY_ID[r.value] : null;
        return { name: resolveSessionLocationValue(r.value), desc:`Days ${r.from}\u2013${r.to} of Hand Feeding.`, locId: loc?loc.id:null };
      });
    }
    return NC_LOCATIONS.map(l=>{
      const loc = LOC_BY_NAME[l.name];
      return { name: loc ? (STATE.locationAssignments[loc.id]||loc.name) : l.name, desc:`${l.sessions} feeding session${l.sessions===1?'':'s'} across the week.`, locId: loc?loc.id:null };
    });
  }
  const seen = new Map(); // raw value (id or literal string) -> true, preserves first-seen order
  phase.days.forEach(d=>{
    if(d.sessionLocations){ Object.values(d.sessionLocations).forEach(v=> seen.set(v,true)); }
    else { seen.set(d.location,true); if(d.location2) seen.set(d.location2,true); }
    // Play/Place fall back to their traditional location (Garden/Home)
    // whenever they appear alone in a component — surface those too.
    Object.values(d.sessions||{}).forEach(comps=>{
      comps.forEach(c=>{
        if(c.type!=='training' || c.ex.length!==1) return;
        if(KEY_FAMILY[c.ex[0]]==='play') seen.set(PLAY_LOCATION, true);
        else if(KEY_FAMILY[c.ex[0]]==='place') seen.set(PLACE_LOCATION, true);
      });
    });
  });
  return [...seen.keys()].map(value=>{
    const loc = typeof value==='number' ? LOC_BY_ID[value] : LOC_BY_NAME[value];
    const name = loc ? (STATE.locationAssignments[loc.id]||loc.name) : resolveSessionLocationValue(value);
    return { name, desc: loc?loc.desc:'', locId: loc?loc.id:null };
  });
}
function renderLocationModal(phaseId){
  const items = phaseLocationsUsed(phaseId);
  const html = items.map(it=>{

    return `<div class="loc-item">

  return modalShell('Locations used this stage', html);

      ? `<div class="rule-item"><div class="rtitle">Back door threshold manners</div><p>${esc(P('Use the threshold routine covered in the exercise card above, every time {{dog_name}} goes in or out of the back door. From here on this becomes a permanent house rule \u2014 {{dog_name}} never races you out of the door.'))}</p></div>`
      : thresholdKind==='reminder'

    } else if(phaseId==='prePhaseA'){

  return modalShell(displayedLabel(phaseId)+' \u2014 Info', body, tabs);

/* ============================================================
   BACKUP — export / restore full app state as a JSON file
   ============================================================ */
function exportBackup(){
  const {ui, ...persisted} = STATE;
  const payload = { app:'dog-training-journey-backup', version:1, exportedAt:new Date().toISOString(), state:persisted };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `dog-training-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('Backup downloaded.');
}
function restoreBackupFromFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const incoming = (parsed && parsed.state && typeof parsed.state === 'object') ? parsed.state : parsed;
      if(!incoming || typeof incoming !== 'object' || Array.isArray(incoming)) throw new Error('not a backup object');
      const ui = STATE.ui;
      STATE = Object.assign(defaultState(), incoming, { ui });
      saveState();
      toast('Backup restored.');
      render();
    }catch(err){
      toast('That file doesn\u2019t look like a valid backup.');
    }
  };
  reader.onerror = ()=> toast('Couldn\u2019t read that file.');
  reader.readAsText(file);
}

/* ============================================================
   ROOT RENDER
   ============================================================ */
function render(){
  applyExtensions();
  applyPlanOverrides();
  const app = document.getElementById('app');
  let html;
  if(!STATE.onboarded){
    html = renderOnboarding();
  } else if(STATE.ui.view==='locationSetup'){
    html = renderLocationSetup();
  } else if(STATE.ui.view==='settings'){
    html = renderSettings();
  } else if(STATE.ui.view==='week' && STATE.ui.weekId){
    html = renderWeekDetail(STATE.ui.weekId);
  } else {
    html = renderJourney();
  }
  if(STATE.ui.modal==='location') html += renderLocationModal(STATE.ui.weekId);
  else if(STATE.ui.modal==='info') html += renderInfoModal(STATE.ui.weekId);
  else if(STATE.ui.modal==='golden') html += renderGoldenModal();
  else if(STATE.ui.modal==='restart-date') html += renderRestartDateModal();
  else if(STATE.ui.modal==='reset-confirm') html += renderResetConfirmModal();
  else if(STATE.ui.modal==='redo-setup-confirm') html += renderRedoSetupConfirmModal();
  else if(STATE.ui.modal==='checkin') html += renderCheckinModal();
  app.innerHTML = html;
  // restore carousel scroll position + wire scroll listener for dots
  if(STATE.ui.view==='week' && STATE.ui.weekId){
    const car = document.getElementById('ex-carousel');
    if(car){
      const phase = PHASES[STATE.ui.weekId];
      const savedIdx = STATE.ui.exCarouselIndex[STATE.ui.weekId] || 0;
      const cardW = car.firstElementChild ? car.firstElementChild.getBoundingClientRect().width + 12 : 0;
      if(savedIdx>0) car.scrollLeft = savedIdx * cardW;
      car.addEventListener('scroll', ()=>{
        clearTimeout(car.__t);
        car.__t = setTimeout(()=>{
          const w = car.firstElementChild ? car.firstElementChild.getBoundingClientRect().width + 12 : 1;
          const i = Math.round(car.scrollLeft / w);
          if(STATE.ui.exCarouselIndex[STATE.ui.weekId] !== i){
            STATE.ui.exCarouselIndex[STATE.ui.weekId] = i;
            const dotsEl = document.querySelector('.carousel-dots');
            if(dotsEl){
              [...dotsEl.children].forEach((el,idx)=> el.classList.toggle('on', idx===i));
            }
          }
        }, 80);
      }, {passive:true});
    }
  }
  // detail header collapse-on-scroll
  if(window.__detailScrollHandler){
    window.removeEventListener('scroll', window.__detailScrollHandler);
    window.__detailScrollHandler = null;
  }
  if(STATE.ui.view==='week' && STATE.ui.weekId){
    const bar = document.getElementById('detail-topbar');
    if(bar){
      const onScroll = ()=>{ bar.classList.toggle('collapsed', window.scrollY > 28); };
      window.addEventListener('scroll', onScroll, {passive:true});
      window.__detailScrollHandler = onScroll;
      onScroll();
    }
  }
  // one-shot: scroll the freshly-opened default day into view if it isn't already
  if(STATE.ui.view==='week' && STATE.ui._scrollToDay!=null){
    const targetDay = STATE.ui._scrollToDay;
    STATE.ui._scrollToDay = null;
    const rowEl = document.getElementById('day-row-'+STATE.ui.weekId+'-'+targetDay);
    if(rowEl){
      requestAnimationFrame(()=>{
        const rect = rowEl.getBoundingClientRect();
        const inView = rect.top >= 60 && rect.bottom <= window.innerHeight;
        if(!inView) rowEl.scrollIntoView({behavior:'smooth', block:'center'});
      });
    }
  }
}

/* ============================================================
   DISPATCH — single delegated click handler
   ============================================================ */
function closeModalWithFlash(){
  const wasInfo = STATE.ui.modal==='info';
  STATE.ui.modal=null;
  render();
  if(wasInfo){
    const btn = document.querySelector('[data-action="open-info"]');
    if(btn){
      btn.classList.add('flash-red');
      setTimeout(()=>{ btn.classList.remove('flash-red'); }, 900);
    }
  }
}
function dismissCheckin(){
  const pending = STATE.ui.pendingDayAction;
  STATE.ui.modal = null;
  STATE.ui.checkinData = null;
  STATE.ui.pendingDayAction = null;
  if(pending){
    const { phaseId, day, isLastDayOfPhase } = pending;
    STATE.ui.openDays[phaseId+':'+day] = false;
    if(isLastDayOfPhase){
      STATE.ui.view = 'journey';
      STATE.ui.weekId = null;
    } else {
      STATE.ui.openDays[phaseId+':'+(day+1)] = true;
    }
  }
  render();
}
document.addEventListener('click', function(e){
  const backdrop = e.target.closest('.modal-backdrop');
  if(backdrop && !e.target.closest('[data-stop]')){
    if(STATE.ui.modal==='checkin'){ dismissCheckin(); } else { closeModalWithFlash(); }
    return;
  }
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const draft = STATE.onboardingDraft;

  switch(action){
    case 'ob-start': goObStep('handfeeding'); STATE.ui._obHistory=['welcome']; render(); break;
    case 'ob-goto-import': goObStep('import'); STATE.ui._obHistory=['welcome']; render(); break;
    case 'apply-full-plan-import': {
      const raw = (STATE.ui.planImportField||'').trim();
      if(!raw){ toast('Paste your plan code first.'); break; }
      try{
        const plan = decodeAndValidatePlan(raw);
        if(!plan.onboarding) throw new Error('missing onboarding details');
        const ob = plan.onboarding;
        STATE.dogName = (ob.dogName||'').trim() || 'Your dog';
        STATE.dogGender = ob.dogGender==='female' ? 'female' : 'male';
        STATE.handFeedingAlreadyDone = !!ob.handFeedingAlreadyDone;
        STATE.newtonsCradleAlreadyDone = STATE.handFeedingAlreadyDone ? !!ob.newtonsCradleAlreadyDone : false;
        STATE.startDate = ob.startDate || lastMondayISO();
        STATE.locationAssignments = {};
        LOCATIONS.forEach(loc=>{ STATE.locationAssignments[loc.id] = loc.name; });
        STATE.completedCount = computeAutoCompletedCount(STATE.startDate, STATE.handFeedingAlreadyDone, STATE.newtonsCradleAlreadyDone);
        STATE.planImport = { v:5, days: plan.days||{} };
        STATE.onboarded = true;
        STATE.ui.planImportField = '';
        STATE.ui.view = 'locationSetup';
        saveState();
        toast('Plan imported \u2014 welcome, '+STATE.dogName+'!');
      }catch(e){
        toast('That plan code couldn\u2019t be read \u2014 double check it was copied in full.');
      }
      render(); break;
    }
    case 'location-setup-skip': STATE.ui.view='journey'; saveState(); render(); break;
    case 'location-setup-continue': STATE.ui.view='journey'; saveState(); render(); break;
    case 'ob-set': {
      const field = t.dataset.field; let val = t.dataset.value;
      if(val==='true') val=true; else if(val==='false') val=false;
      draft[field]=val; render(); break;
    }
    case 'ob-continue': obNext(t.dataset.from); break;
    case 'ob-back': obBack(); break;
    case 'ob-finish': {
      STATE.dogName = draft.dogName.trim();
      STATE.dogGender = draft.dogGender || 'male';
      STATE.startDate = draft.startDate;
      STATE.handFeedingAlreadyDone = draft.handFeedingStatus === 'done';
      STATE.newtonsCradleAlreadyDone = STATE.handFeedingAlreadyDone ? (draft.newtonsCradleStatus === 'done') : false;
      STATE.locationAssignments = {};
      LOCATIONS.forEach(loc=>{ STATE.locationAssignments[loc.id] = (draft.locationAssignments && draft.locationAssignments[loc.id]) || loc.name; });
      STATE.completedCount = onboardingNeedsAutoDate(draft)
        ? computeAutoCompletedCount(STATE.startDate, STATE.handFeedingAlreadyDone, STATE.newtonsCradleAlreadyDone)
        : 0;
      STATE.onboarded = true;
      saveState();
      toast('Journey started \u2014 welcome, '+STATE.dogName+'!');
      render(); break;
    }
    case 'open-week': {
      if(t.disabled) break;
      const phaseId = t.dataset.phase;
      STATE.ui.view='week'; STATE.ui.weekId=phaseId; STATE.ui.modal=null;
      // collapse every day in this phase, then auto-expand only today's/active day
      Object.keys(STATE.ui.openDays).forEach(k=>{ if(k.indexOf(phaseId+':')===0) delete STATE.ui.openDays[k]; });
      const defaultDay = findDefaultOpenDay(phaseId);
      if(defaultDay!=null) STATE.ui.openDays[phaseId+':'+defaultDay] = true;
      STATE.ui._scrollToDay = defaultDay;
      const allDays = buildAllDays();
      const startIdx = phaseStartIndex(phaseId, allDays);
      if(STATE.completedCount === startIdx){
        STATE.ui.modal='info'; STATE.ui.modalTab='rules';
      }
      render(); break;
    }
    case 'back-to-journey': STATE.ui.view='journey'; STATE.ui.weekId=null; STATE.ui.modal=null; render(); break;
    case 'open-settings': STATE.ui.view='settings'; STATE.ui.modal=null; render(); break;
    case 'open-location': STATE.ui.modal='location'; STATE.ui.weekId = t.dataset.phase || STATE.ui.weekId; render(); break;
    case 'open-info': STATE.ui.modal='info'; STATE.ui.modalTab='rules'; STATE.ui.weekId = t.dataset.phase || STATE.ui.weekId; render(); break;
    case 'open-golden': STATE.ui.modal='golden'; render(); break;
    case 'close-modal': closeModalWithFlash(); break;
    case 'modal-tab': STATE.ui.modalTab = t.dataset.tab; render(); break;
    case 'toggle-day': {
      const key = t.dataset.phase+':'+t.dataset.day;
      STATE.ui.openDays[key] = !STATE.ui.openDays[key];
      render(); break;
    }
    case 'complete-day': {
      const phaseId = t.dataset.phase, day = Number(t.dataset.day);
      const allDays = buildAllDays();
      const gIdx = dayGlobalIndex(phaseId, day, allDays);
      if(!canCompleteDay(gIdx)) break;
      STATE.completedCount = gIdx+1;
      saveState();
      toast('Day '+day+' marked complete.');
      const phase = PHASES[phaseId];
      const isLastDayOfPhase = phase.days[phase.days.length-1].day === day;
      const checkin = checkinForCompletedDay(phaseId, day);
      if(checkin){
        STATE.ui.checkinData = checkin;
        STATE.ui.pendingDayAction = { phaseId, day, isLastDayOfPhase };
        STATE.ui.modal = 'checkin';
      } else {
        STATE.ui.openDays[phaseId+':'+day] = false;
        if(isLastDayOfPhase){
          STATE.ui.view = 'journey';
          STATE.ui.weekId = null;
          STATE.ui.modal = null;
        } else {
          STATE.ui.openDays[phaseId+':'+(day+1)] = true;
        }
      }
      render(); break;
    }
    case 'close-checkin': dismissCheckin(); break;
    case 'extend-phase': {
      const phaseId = t.dataset.phase;
      const allDays = buildAllDays();
      if(!canExtendPhase(phaseId, allDays)){ toast('Can\u2019t extend a completed week.'); break; }
      if(!STATE.extensions) STATE.extensions = {};
      STATE.extensions[phaseId] = (STATE.extensions[phaseId]||0) + 1;
      saveState();
      toast('Added a 1-week extension.');
      render(); break;
    }
    case 'shrink-phase': {
      const phaseId = t.dataset.phase;
      const allDays = buildAllDays();
      if(!canShrinkPhase(phaseId, allDays)){ toast('Can\u2019t remove that week \u2014 progress has already been made into it.'); break; }
      STATE.extensions[phaseId] = Math.max(0, (STATE.extensions[phaseId]||0) - 1);
      saveState();
      toast('Removed the extension week.');
      render(); break;
    }
    case 'settings-set': {
      STATE[t.dataset.field] = t.dataset.value;
      saveState(); render(); break;
    }
    case 'dev-unlock': {
      const entered = STATE.ui.devPasswordField || '';
      if(entered === 'dev-adam'){
        STATE.ui.devUnlocked = true;
        STATE.ui.devPasswordField = '';
        toast('Developer mode unlocked.');
      } else {
        toast('Incorrect password.');
      }
      render(); break;
    }
    case 'dev-lock': STATE.ui.devUnlocked = false; render(); break;
    case 'open-redo-setup-confirm': STATE.ui.modal='redo-setup-confirm'; render(); break;
    case 'confirm-redo-setup': {
      const devFlag = STATE.ui.devUnlocked;
      STATE = defaultState();
      STATE.ui.devUnlocked = devFlag;
      saveState();
      toast('Back to setup.');
      render();
      break;
    }
    case 'toggle-dategate': {
      STATE.settings.dateGateEnabled = !STATE.settings.dateGateEnabled;
      saveState(); render(); break;
    }
    case 'export-backup': exportBackup(); break;
    case 'trigger-restore': {
      const input = document.getElementById('restore-file-input');
      if(input) input.click();
      break;
    }
    case 'apply-plan-import': {
      const raw = (STATE.ui.planImportField||'').trim();
      if(!raw){ toast('Paste a plan code first.'); break; }
      try{
        const plan = decodeAndValidatePlan(raw);
        // Settings-screen updates only ever touch exercises/rules/locations —
        // dog details and start date are set once, at initial import.
        STATE.planImport = { v:5, days: plan.days||{} };
        STATE.ui.planImportField = '';
        saveState();
        toast('Trainer plan applied.');
      }catch(e){
        toast('That plan code couldn\u2019t be read \u2014 double check it was copied in full.');
      }
      render(); break;
    }
    case 'clear-plan-import': {
      STATE.planImport = null;
      saveState();
      toast('Reverted to the default plan.');
      render(); break;
    }
    case 'open-restart-date': STATE.ui.modal='restart-date'; render(); break;
    case 'set-startdate': {
      STATE.startDate = t.dataset.value;
      saveState(); STATE.ui.modal=null; toast('Start date updated.'); render(); break;
    }
    case 'open-reset-confirm': STATE.ui.modal='reset-confirm'; render(); break;
    case 'confirm-reset-progress': {
      STATE.completedCount = 0;
      STATE.ui.openDays = {};
      STATE.ui.modal = null;
      saveState();
      toast('Progress reset.');
      render();
      break;
    }
    default: break;
  }
}, false);

document.addEventListener('input', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='ob-input'){
    STATE.onboardingDraft[el.dataset.field] = el.value;
  } else if(action==='ob-loc-input'){
    STATE.onboardingDraft.locationAssignments = STATE.onboardingDraft.locationAssignments || {};
    STATE.onboardingDraft.locationAssignments[el.dataset.locid] = el.value;
  } else if(action==='settings-input'){
    STATE[el.dataset.field] = el.value;
    saveState();
  } else if(action==='settings-loc-input'){
    STATE.locationAssignments[el.dataset.locid] = el.value;
    saveState();
  } else if(action==='dev-password-input'){
    STATE.ui.devPasswordField = el.value;
  } else if(action==='plan-import-input'){
    STATE.ui.planImportField = el.value;
  } else if(action==='ob-import-input'){
    STATE.ui.planImportField = el.value;
  }
}, false);

document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target && e.target.dataset && e.target.dataset.action==='dev-password-input'){
    e.preventDefault();
    const btn = document.querySelector('[data-action="dev-unlock"]');
    if(btn) btn.click();
  }
}, false);

document.addEventListener('change', function(e){
  if(e.target && e.target.id === 'restore-file-input'){
    const file = e.target.files && e.target.files[0];
    if(file) restoreBackupFromFile(file);
    e.target.value = '';
  }
}, false);
